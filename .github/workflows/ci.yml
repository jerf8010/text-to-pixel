name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The default Linux wheel bundles CUDA (gigabytes); the CPU build is all CI needs.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the project
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check src tests scripts app/backend
      - name: Tests (project and API)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      # `npm ci` needs a lock file; the steps below are skipped until package-lock.json is committed.
      - name: Check for package-lock.json
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.lock.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install
        if: steps.lock.outputs.present == 'true'
        run: npm ci
      - name: Build
        if: steps.lock.outputs.present == 'true'
        run: npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plain-JS UI has no dependencies: Node's built-in test runner is enough.
      - name: Unit tests of the web UI
        run: node --test "app/web/tests/*.test.js"
