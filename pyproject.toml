[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelgen"
version = "0.1.0"
description = "Text-to-pixel-art with a from-scratch Transformer encoder-decoder"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "pillow",
  "matplotlib",
  "pyyaml",
  "mlflow",
  "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]
real-data = ["datasets", "scikit-learn", "scikit-image"]
app = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/backend/api_tests"]
filterwarnings = [
    "ignore::sqlalchemy.exc.SADeprecationWarning",
]
